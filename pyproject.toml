[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "async-s3"
dynamic = [ "version",]
description = "S3 Bucket helper utils. Async list objects by folders."
keywords = [ "async", "aws", "s3", "bucket", "list-objects", "folders",]
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [ "click", "rich-click", "aiobotocore", "boto3",]
[[project.authors]]
name = "Andrey Sorokin"
email = "andrey@sorokin.engineer"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://andgineer.github.io/async-s3/"
Documentation = "https://andgineer.github.io/async-s3/"

[project.scripts]
as3 = "async_s3.main:as3"

[tool.setuptools]
packages = "find:"

[tool.ruff]
line-length = 99

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingModuleSource = false
reportMissingTypeStubs = true
include = [ "src",]
exclude = [ "**/node_modules", "**/__pycache__",]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.manifest]
include = [ "README.md", "LICENSE",]

[tool.hatch.version]
path = "src/async_s3/__about__.py"

[dependency-groups]
dev = [
    "allure-pytest>=2.16.0",
    "hatchling>=1.27.0",
    "invoke>=3.0.3",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocstrings[python]>=0.30.1",
    "moto[server]>=5.1.22",
    "pre-commit>=4.3.0",
    "pymdown-extensions>=10.21.3",
    "pyrefly>=1.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
]
