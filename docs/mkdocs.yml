# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: async_s3
site_url: https://andgineer.github.io/async-s3
site_author: Andrey Sorokin

# Repository
repo_name: async_s3
repo_url: https://github.com/andgineer/async-s3
edit_uri: edit/master/docs
docs_dir: 'src/LANGUAGE'
site_dir: 'SITE_DIR'

plugins:
  - awesome-pages
  - search:
      lang: LANGUAGE
  - mkdocstrings:
        handlers:
          python:
            options:
              show_root_heading: true

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: 'docs/includes'
theme:
  name: material
  features:
    - toc.integrate
    - navigation.tracking
    - content.code.copy

extra:
  alternate:
    - name: English
      link: /async-s3/
      lang: en
    - name: Русский
      link: /async-s3/ru/
      lang: ru

nav:
  - index.md
  - installation.md
  - as3.md
